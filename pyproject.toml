[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-privacy-filter"
version = "0.1.0"
description = "Cross-platform real-time personalized face privacy filter"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "onnx>=1.16,<2",
  "onnxruntime>=1.20,<2",
  "opencv-python>=4.10,<5",
]

[project.scripts]
privacy-enroll = "privacy_filter.enroll_cli:main"
privacy-recognize = "privacy_filter.recognize_webcam:main"
inspect-models = "privacy_filter.inspect_models:main"

[tool.setuptools.packages.find]
include = ["privacy_filter*"]
