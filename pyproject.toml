[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-privacy-filter"
version = "0.5.0"
description = "Cross-platform real-time personalized face privacy filter"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "onnx>=1.16,<2",
  "onnxruntime>=1.20,<2; sys_platform != 'win32'",
  "onnxruntime-directml>=1.20,<2; sys_platform == 'win32'",
  "opencv-python>=4.10,<5",
  "ultralytics==8.4.120",
  "lap>=0.5.12,<0.6",
]

[project.optional-dependencies]
grounded-video = [
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "transformers>=4.57,<6",
  "pillow>=10,<13",
  "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]
image-prompt = [
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "transformers>=4.57,<6",
  "timm>=1.0,<2",
  "pillow>=10,<13",
  "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]
virtual-camera = [
  "pyvirtualcam>=0.15,<0.16",
]

[project.scripts]
privacy-enroll = "privacy_filter.enroll_cli:main"
privacy-recognize = "privacy_filter.recognize_webcam:main"
inspect-models = "privacy_filter.inspect_models:main"

[tool.setuptools.packages.find]
include = ["privacy_filter*"]
